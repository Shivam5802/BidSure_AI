services:
  # ----------------------------------------------------
  # 1. Backend Service (Fastify + Prisma)
  # ----------------------------------------------------
  - type: web
    name: bidguard-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma db push && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: bidguard-db
          property: connectionString
      - key: CORS_ORIGIN
        sync: false # Set this to your Vercel URL (e.g., https://bidguard.vercel.app)
      - key: JWT_SECRET
        generateValue: true
      - key: LLM_PROVIDER
        value: mock
      - key: AUTH_ENFORCED
        value: false

# ----------------------------------------------------
# 2. PostgreSQL Database
# ----------------------------------------------------
databases:
  - name: bidguard-db
    plan: free
    databaseName: bidguard
    user: bidguard
