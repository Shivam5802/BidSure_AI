<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none" stroke="#2563EB" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Flagpole & Flag -->
  <line x1="300" y1="30" x2="300" y2="100" stroke-width="1.5" />
  <path d="M300 35 C315 32 320 42 335 38 L335 55 C320 59 315 49 300 52 Z" fill="#2563EB" fill-opacity="0.2" />

  <!-- Main Central Dome -->
  <path d="M250 120 C250 80 350 80 350 120 Z" fill="none" stroke-width="2" />
  <ellipse cx="300" cy="120" rx="50" ry="8" />
  <rect x="290" y="70" width="20" height="15" rx="2" />
  <path d="M295 70 C295 62 305 62 305 70" />

  <!-- Dome Drum & Windows -->
  <rect x="245" y="120" width="110" height="25" />
  <line x1="260" y1="120" x2="260" y2="145" />
  <line x1="280" y1="120" x2="280" y2="145" />
  <line x1="300" y1="120" x2="300" y2="145" />
  <line x1="320" y1="120" x2="320" y2="145" />
  <line x1="340" y1="120" x2="340" y2="145" />

  <!-- Dome Base & Architrave -->
  <rect x="235" y="145" width="130" height="10" />

  <!-- Side Cupolas (Chhatris) -->
  <!-- Left Chhatri -->
  <path d="M160 170 C160 150 200 150 200 170 Z" />
  <rect x="165" y="170" width="30" height="15" />
  <line x1="172" y1="170" x2="172" y2="185" />
  <line x1="188" y1="170" x2="188" y2="185" />
  <rect x="155" y="185" width="50" height="6" />

  <!-- Right Chhatri -->
  <path d="M400 170 C400 150 440 150 440 170 Z" />
  <rect x="405" y="170" width="30" height="15" />
  <line x1="412" y1="170" x2="412" y2="185" />
  <line x1="428" y1="170" x2="428" y2="185" />
  <rect x="395" y="185" width="50" height="6" />

  <!-- Roofline Balustrade & Cornice -->
  <line x1="80" y1="195" x2="520" y2="195" stroke-width="2" />
  <line x1="70" y1="202" x2="530" y2="202" stroke-width="1.5" />
  
  <!-- Balusters on roofline -->
  <g opacity="0.6">
    <line x1="90" y1="195" x2="90" y2="202" />
    <line x1="110" y1="195" x2="110" y2="202" />
    <line x1="130" y1="195" x2="130" y2="202" />
    <line x1="220" y1="195" x2="220" y2="202" />
    <line x1="380" y1="195" x2="380" y2="202" />
    <line x1="470" y1="195" x2="470" y2="202" />
    <line x1="490" y1="195" x2="490" y2="202" />
    <line x1="510" y1="195" x2="510" y2="202" />
  </g>

  <!-- Central Portico Entablature -->
  <polygon points="215,202 385,202 380,215 220,215" fill="#2563EB" fill-opacity="0.05" />

  <!-- Main Colonnade Pillars -->
  <!-- Center Columns -->
  <line x1="230" y1="215" x2="230" y2="285" stroke-width="2" />
  <line x1="250" y1="215" x2="250" y2="285" stroke-width="2" />
  <line x1="270" y1="215" x2="270" y2="285" stroke-width="2" />
  <line x1="290" y1="215" x2="290" y2="285" stroke-width="2" />
  <line x1="310" y1="215" x2="310" y2="285" stroke-width="2" />
  <line x1="330" y1="215" x2="330" y2="285" stroke-width="2" />
  <line x1="350" y1="215" x2="350" y2="285" stroke-width="2" />
  <line x1="370" y1="215" x2="370" y2="285" stroke-width="2" />

  <!-- Central Portal / Grand Doorway -->
  <path d="M285 285 L285 250 C285 240 315 240 315 250 L315 285 Z" fill="#2563EB" fill-opacity="0.1" />

  <!-- Left Wing -->
  <rect x="80" y="202" width="135" height="83" />
  <!-- Left Windows Upper -->
  <path d="M100 230 L100 220 C100 216 115 216 115 220 L115 230 Z" />
  <path d="M140 230 L140 220 C140 216 155 216 155 220 L155 230 Z" />
  <path d="M180 230 L180 220 C180 216 195 216 195 220 L195 230 Z" />
  <!-- Left Windows Lower -->
  <rect x="100" y="245" width="15" height="25" />
  <rect x="140" y="245" width="15" height="25" />
  <rect x="180" y="245" width="15" height="25" />

  <!-- Right Wing -->
  <rect x="385" y="202" width="135" height="83" />
  <!-- Right Windows Upper -->
  <path d="M405 230 L405 220 C405 216 420 216 420 220 L420 230 Z" />
  <path d="M445 230 L445 220 C445 216 460 216 460 220 L460 230 Z" />
  <path d="M485 230 L485 220 C485 216 500 216 500 220 L500 230 Z" />
  <!-- Right Windows Lower -->
  <rect x="405" y="245" width="15" height="25" />
  <rect x="445" y="245" width="15" height="25" />
  <rect x="485" y="245" width="15" height="25" />

  <!-- Plinth & Grand Steps -->
  <rect x="50" y="285" width="500" height="15" stroke-width="1.5" />
  <line x1="60" y1="300" x2="540" y2="300" />
  <line x1="70" y1="308" x2="530" y2="308" />
  <line x1="80" y1="316" x2="520" y2="316" />
  <line x1="90" y1="324" x2="510" y2="324" stroke-width="1.5" />

  <!-- Foreground Courtyard Ground Lines -->
  <line x1="20" y1="340" x2="580" y2="340" opacity="0.4" />
  <line x1="0" y1="360" x2="600" y2="360" opacity="0.2" />
</svg>
