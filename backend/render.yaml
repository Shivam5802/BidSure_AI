services:
  - type: web
    name: bidsure-backend
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma db push && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: bidsure-db
          property: connectionString
      - key: CORS_ORIGIN
        sync: false  # Set to your Vercel/Netlify frontend URL e.g. https://your-app.vercel.app
      - key: JWT_SECRET
        generateValue: true
      - key: AUTH_ENFORCED
        value: false
      - key: LLM_PROVIDER
        value: mock
      - key: LLM_API_KEY
        sync: false  # Set if using Gemini or OpenAI
      - key: LLM_MODEL
        value: gemini-2.5-flash
      - key: MAX_TENDER_FILE_SIZE_MB
        value: 50

databases:
  - name: bidsure-db
    plan: free
    databaseName: bidguard
    user: bidguard
